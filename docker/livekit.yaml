# LiveKit dev configuration. NOT for production (keys are well-known).
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
keys:
  # key: secret — must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env
  devkey: devsecret_change_me_at_least_32_chars_long
logging:
  level: info
  json: false
room:
  auto_create: false
  empty_timeout: 300
  departure_timeout: 20
