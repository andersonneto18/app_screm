# Local development infrastructure for ScreenRoom.
# Postgres runs on Neon (cloud) — only LiveKit + Redis are local.
#
#   docker compose up -d
#
services:
  livekit:
    image: livekit/livekit-server:v1.8
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1
    restart: unless-stopped
    ports:
      - "7880:7880" # signalling (ws)
      - "7881:7881" # RTC over TCP
      - "50000-50020:50000-50020/udp" # RTC media
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
